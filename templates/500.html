{% extends "base.html" %}

{% block title %}500 — Core Subsystem Disruption{% endblock %}

{% block content %}
<div style="min-height:75vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;">
    <div class="glass-panel" style="max-width:520px;padding:3rem 2rem;border-radius:var(--radius-xl);border-color:rgba(244,63,94,0.4);">
        <div style="font-size:3.5rem;font-weight:900;letter-spacing:-0.03em;color:#f43f5e;margin-bottom:0.5rem;" class="font-mono-numbers">
            500
        </div>
        <h2 style="font-size:1.5rem;margin-bottom:0.8rem;">Subsystem Disruption</h2>
        <p style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:2rem;line-height:1.6;">
            An internal computational condition occurred while processing this telemetry request. Our engineers have been alerted.
        </p>
        <div style="display:flex;justify-content:center;gap:1rem;">
            <a href="{% if current_user.is_authenticated %}{{ url_for('dashboard.index') }}{% else %}{{ url_for('dashboard.landing') }}{% endif %}" class="btn-cyber-primary">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
